name: bluebuild
on:
  schedule:
    - cron: "00 06 * * *" # build daily at 06:00 UTC
  push:
    branches: [main]
    paths-ignore:
      - "**.md" # don't rebuild if only documentation has changed
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  bluebuild:
    name: Build ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe-niri.yml
          - recipe-kinoite.yml
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gather base image data from recipe
        env:
          RECIPE: recipes/${{ matrix.recipe }}
        run: |
          echo "BASE_IMAGE_NAME=$(grep '^base-image:' "$RECIPE" | sed 's/^base-image: //; s/.*\///')" >> "$GITHUB_ENV"
          echo "IMAGE_MAJOR_VERSION=$(grep '^image-version:' "$RECIPE" | sed 's/^image-version: //')" >> "$GITHUB_ENV"

      - name: Verify base image signature
        uses: EyeCantCU/cosign-action/verify@58722a084c82190b57863002d494c91eabbe9e79 # v0.3.0
        with:
          containers: ${{ env.BASE_IMAGE_NAME }}:${{ env.IMAGE_MAJOR_VERSION }}
          registry: quay.io/fedora-ostree-desktops
          pubkey: https://gitlab.com/fedora/ostree/ci-test/-/raw/main/quay.io-fedora-ostree-desktops.pub

      - name: Build Custom Image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13.0
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          skip_checkout: true
          # chunked layers: small incremental updates for rpm-ostree; squash: no layers wasted on deleted files
          build_chunked_oci: true
          max_layers: 128
          squash: true
          retry_push_count: 3
