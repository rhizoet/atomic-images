# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: kinoite
description: Fedora Kinoite with a few CLI tools and Firefox as Flatpak
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 44

modules:
  - type: files
    files:
      - source: common
        destination: /

  - type: dnf
    install:
      packages:
        - zsh
        - git
        - micro
        - gcc
        - gcc-c++
        - make
        - unzip
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: systemd
    system:
      enabled:
        - rpm-ostreed-automatic.timer

  - type: brew

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox

  - type: os-release
    properties:
      PRETTY_NAME: Atomic Kinoite

  - type: signing
